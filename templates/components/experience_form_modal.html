<div id="{{ modal_id }}"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="{{ modal_id }}-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="{{ modal_id }}"
            popovertargetaction="hide"
            aria-label="Tutup form experience"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="{{ modal_id }}"
                popovertargetaction="hide"
                aria-label="Tutup form experience">&times;</button>

        <h2 id="{{ modal_id }}-title">{{ modal_title }}</h2>
        <form id="{{ form_id }}"
              method="post"
              action="{{ form_action|default:'' }}"
              class="project-form"
              novalidate>
            {% csrf_token %}
            <p class="form-feedback hide" role="alert"></p>
            {% for field in modal_form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    <span id="{{ field.id_for_label }}_error" class="field-error"></span>
                </div>
            {% endfor %}

            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="{{ modal_id }}"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">{{ submit_label }}</button>
            </div>
        </form>
    </div>
</div>
