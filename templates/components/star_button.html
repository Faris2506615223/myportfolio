{% with starred_users=starred_object.starred_by.all %}
    <form method="post" action="{{ star_url }}" class="star-form">
        {% csrf_token %}
        <button type="submit"
                class="button button-star{% if user in starred_users %} is-starred{% endif %}"
                aria-pressed="{% if user in starred_users %}true{% else %}false{% endif %}"
                aria-label="{% if user in starred_users %}Batalkan star untuk {{ starred_object }}{% else %}Beri star untuk {{ starred_object }}{% endif %}"
                title="{% if starred_users %}Dibintangi oleh {{ starred_users|join:', ' }}{% elif user.is_authenticated %}Jadilah yang pertama memberi star{% else %}Login untuk memberi star{% endif %}">
            <span aria-hidden="true">&#9733;</span>
            {% if user in starred_users %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ starred_users|length }}</span>
        </button>
    </form>
{% endwith %}
